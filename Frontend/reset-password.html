<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Fact.AI</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="account.css">
  <script src="config.js"></script>
</head>
<body>
  <main class="page">
    <div class="brand-row">
      <a href="index.html" class="brand">Fact.AI</a>
    </div>

    <section>
      <div class="auth-wrapper">
        <div class="auth-card">
          <h2 style="margin-bottom: 16px;">Reset Password</h2>

          <form id="reset-form" class="auth-form">
            <label for="new-password">Password Baru</label>
            <input id="new-password" type="password" placeholder="8 sampai 72 karakter" minlength="8" maxlength="72" required/>

            <button type="submit">Simpan Password Baru</button>
          </form>

          <p id="reset-status" style="margin-top: 16px;"></p>
          <a href="account.html" id="back-link" class="hidden">Ke halaman masuk</a>
        </div>
      </div>
    </section>
  </main>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-icon">!</div>
      <h3 id="modal-title">Perhatian</h3>
      <p id="modal-message">Pesan error</p>
      <button id="modal-close-btn" class="btn-primary">OK</button>
    </div>
  </div>

  <script>
    const API_BASE_URL = window.API_BASE_URL;
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    const resetForm    = document.getElementById('reset-form');
    const resetStatus  = document.getElementById('reset-status');
    const backLink     = document.getElementById('back-link');

    const modalOverlay = document.getElementById('modal-overlay');
    const modalTitle   = document.getElementById('modal-title');
    const modalMessage = document.getElementById('modal-message');
    const modalCloseBtn = document.getElementById('modal-close-btn');

    function showModal(title, message) {
      modalTitle.textContent = title;
      modalMessage.textContent = message;
      modalOverlay.classList.remove('hidden');
    }
    modalCloseBtn.addEventListener('click', () => modalOverlay.classList.add('hidden'));

    function formatError(detail) {
      if (!detail) return 'Terjadi kesalahan, coba lagi.';
      if (typeof detail === 'string') return detail;
      if (Array.isArray(detail)) return detail.map(d => d.msg || 'Input tidak valid').join('. ');
      return 'Terjadi kesalahan, coba lagi.';
    }

    if (!token) {
      resetForm.classList.add('hidden');
      resetStatus.textContent = 'Token tidak ditemukan di URL.';
    }

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('new-password').value;

      try {
        const response = await fetch(API_BASE_URL + '/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, new_password: newPassword }),
        });
        const body = await response.json().catch(() => ({}));

        if (!response.ok) throw new Error(formatError(body.detail));

        resetForm.classList.add('hidden');
        resetStatus.textContent = 'Password berhasil diubah. Silakan masuk dengan password baru kamu.';
        backLink.classList.remove('hidden');
      } catch (err) {
        showModal('Gagal Reset Password', err.message);
      }
    });
  </script>
</body>
</html>
